<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易 BMI 計算器 | 健康體重管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for history list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-teal-500 text-white flex items-center justify-center shadow-md shadow-teal-500/20">
                    <i class="fa-solid font-bold fa-heart-pulse text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">BMI 健康計算器</h1>
                    <p class="text-xs text-slate-500">自動換算身體質量指數與健康體重建議</p>
                </div>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 bg-teal-50 text-teal-700 rounded-full border border-teal-200">
                衛生福利部標準
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

            <div class="md:col-span-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-sliders text-teal-500"></i> 輸入生理數據
                        </h2>
                        <button id="reset-btn" type="button" class="text-xs text-slate-400 hover:text-slate-600 transition flex items-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> 重置
                        </button>
                    </div>

                    <form id="bmi-form" onsubmit="return false;" class="space-y-5">
                        <!-- Height Input -->
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <label for="height" class="text-sm font-medium text-slate-700">身高 (cm)</label>
                                <span id="height-val" class="text-sm font-semibold text-teal-600">170 cm</span>
                            </div>
                            <div class="relative flex items-center">
                                <input type="number" id="height" min="50" max="250" value="170" placeholder="例如：170"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-slate-800 font-medium transition text-base">
                                <span class="absolute right-4 text-slate-400 text-sm pointer-events-none">cm</span>
                            </div>
                            <input type="range" id="height-range" min="100" max="220" value="170" 
                                class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-teal-500 mt-3">
                        </div>

                        <!-- Weight Input -->
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <label for="weight" class="text-sm font-medium text-slate-700">體重 (kg)</label>
                                <span id="weight-val" class="text-sm font-semibold text-teal-600">65 kg</span>
                            </div>
                            <div class="relative flex items-center">
                                <input type="number" id="weight" min="20" max="300" step="0.1" value="65" placeholder="例如：65"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-slate-800 font-medium transition text-base">
                                <span class="absolute right-4 text-slate-400 text-sm pointer-events-none">kg</span>
                            </div>
                            <input type="range" id="weight-range" min="30" max="150" step="0.5" value="65" 
                                class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-teal-500 mt-3">
                        </div>
                    </form>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-100">
                    <button id="save-btn" type="button" class="w-full py-3 bg-teal-500 hover:bg-teal-600 active:bg-teal-700 text-white font-medium rounded-xl shadow-md shadow-teal-500/20 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bookmark"></i> 儲存本次紀錄
                    </button>
                </div>
            </div>

            <div class="md:col-span-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-teal-500"></i> 計算結果
                    </h2>

                    <!-- Main BMI Display -->
                    <div class="text-center py-4 bg-slate-50 rounded-2xl border border-slate-100 mb-6 relative overflow-hidden">
                        <div class="text-xs text-slate-500 font-medium mb-1">您的 BMI 數值</div>
                        <div id="bmi-value" class="text-5xl font-extrabold text-teal-600 transition-all duration-300">
                            22.5
                        </div>
                        <div id="bmi-badge" class="inline-block px-3 py-1 mt-2 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 transition-all duration-300">
                            適中 (健康體重)
                        </div>
                    </div>

                    <!-- BMI Scale Indicator -->
                    <div class="mb-6">
                        <div class="flex justify-between text-xs text-slate-400 mb-1 font-medium">
                            <span>18.5</span>
                            <span>24.0</span>
                            <span>27.0</span>
                            <span>30.0</span>
                        </div>
                        <!-- Progress bar segments -->
                        <div class="relative h-3 w-full bg-slate-100 rounded-full overflow-hidden flex">
                            <div class="h-full bg-sky-400 w-[25%]" title="體重過輕 (<18.5)"></div>
                            <div class="h-full bg-emerald-400 w-[22%]" title="正常範圍 (18.5-23.9)"></div>
                            <div class="h-full bg-amber-400 w-[12%]" title="過重 (24.0-26.9)"></div>
                            <div class="h-full bg-orange-400 w-[12%]" title="輕度肥胖 (27.0-29.9)"></div>
                            <div class="h-full bg-rose-500 w-[29%]" title="中重度肥胖 (≥30.0)"></div>
                        </div>
                        <!-- Marker Needle -->
                        <div class="relative w-full h-3">
                            <div id="bmi-pointer" class="absolute top-0 transform -translate-x-1/2 transition-all duration-300 flex flex-col items-center" style="left: 40%;">
                                <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[8px] border-b-slate-800"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Details & Advice -->
                    <div class="space-y-3">
                        <div class="p-3 bg-slate-50 rounded-xl flex items-center justify-between text-xs">
                            <span class="text-slate-500">標準理想體重範圍</span>
                            <span id="ideal-weight" class="font-bold text-slate-700">53.5 ~ 69.1 kg</span>
                        </div>
                        <div class="p-3.5 bg-slate-50 rounded-xl text-xs text-slate-600 leading-relaxed" id="bmi-advice">
                            您的體重維持在相當健康的標準範圍內！請繼續保持均衡飲食與規律運動習慣。
                        </div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-12 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-teal-500"></i> 歷史紀錄
                    </h3>
                    <button id="clear-history" type="button" class="text-xs text-rose-500 hover:text-rose-600 transition flex items-center gap-1 font-medium">
                        <i class="fa-solid fa-trash-can"></i> 清除紀錄
                    </button>
                </div>

                <div id="history-container" class="max-h-52 overflow-y-auto custom-scrollbar pr-1">
                    <!-- History list populated by JS -->
                    <div id="empty-history" class="text-center py-8 text-slate-400 text-sm">
                        目前尚無儲存的歷史紀錄
                    </div>
                    <div id="history-list" class="space-y-2 hidden"></div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400">
            <p>BMI 僅作為成人體重管理之初步參考指標，不適用於未滿17歲兒童青少年、孕婦、哺乳婦或高肌肉量運動員。</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const heightInput = document.getElementById('height');
            const heightRange = document.getElementById('height-range');
            const heightVal = document.getElementById('height-val');

            const weightInput = document.getElementById('weight');
            const weightRange = document.getElementById('weight-range');
            const weightVal = document.getElementById('weight-val');

            const bmiValueEl = document.getElementById('bmi-value');
            const bmiBadgeEl = document.getElementById('bmi-badge');
            const bmiPointerEl = document.getElementById('bmi-pointer');
            const idealWeightEl = document.getElementById('ideal-weight');
            const bmiAdviceEl = document.getElementById('bmi-advice');

            const resetBtn = document.getElementById('reset-btn');
            const saveBtn = document.getElementById('save-btn');
            const clearHistoryBtn = document.getElementById('clear-history');
            const historyListEl = document.getElementById('history-list');
            const emptyHistoryEl = document.getElementById('empty-history');

            // Storage array
            let historyData = JSON.parse(localStorage.getItem('bmi_history') || '[]');

            function calculateBMI() {
                const heightCm = parseFloat(heightInput.value);
                const weightKg = parseFloat(weightInput.value);

                if (!heightCm || !weightKg || heightCm <= 0 || weightKg <= 0) {
                    bmiValueEl.textContent = '--';
                    bmiBadgeEl.textContent = '請輸入有效數值';
                    bmiBadgeEl.className = 'inline-block px-3 py-1 mt-2 rounded-full text-xs font-bold bg-slate-100 text-slate-500';
                    return;
                }

                const heightM = heightCm / 100;
                const bmi = weightKg / (heightM * heightM);
                const bmiFormatted = bmi.toFixed(1);

                // Calculate Ideal Weight range (BMI 18.5 to 23.9)
                const minWeight = (18.5 * heightM * heightM).toFixed(1);
                const maxWeight = (23.9 * heightM * heightM).toFixed(1);
                idealWeightEl.textContent = `${minWeight} ~ ${maxWeight} kg`;

                // Category Evaluation (Taiwan MoHW standard)
                let category = '';
                let badgeClass = '';
                let adviceText = '';
                let pointerPercent = 0;

                if (bmi < 18.5) {
                    category = '體重過輕';
                    badgeClass = 'bg-sky-100 text-sky-700';
                    adviceText = '您的體重低於標準範圍。建議適度增加營養攝取，結合適當的肌肉力量訓練以增強體魄。';
                    // Scale placement 0 - 25% (range 15 - 18.5)
                    pointerPercent = Math.max(2, Math.min(24, ((bmi - 12) / (18.5 - 12)) * 25));
                } else if (bmi >= 18.5 && bmi < 24.0) {
                    category = '適中 (健康體重)';
                    badgeClass = 'bg-emerald-100 text-emerald-700';
                    adviceText = '恭喜！您的體重維持在理想標準範圍內。請繼續保持健康均衡的飲食與規律運動習慣。';
                    // Scale placement 25% - 47% (range 18.5 - 24.0)
                    pointerPercent = 25 + ((bmi - 18.5) / (24 - 18.5)) * 22;
                } else if (bmi >= 24.0 && bmi < 27.0) {
                    category = '體重過重';
                    badgeClass = 'bg-amber-100 text-amber-700';
                    adviceText = '您的體重已稍高於標準。建議稍微調整飲食結構，減少高熱量食物攝取並增加日常活動量。';
                    // Scale placement 47% - 59% (range 24 - 27)
                    pointerPercent = 47 + ((bmi - 24) / (27 - 24)) * 12;
                } else if (bmi >= 27.0 && bmi < 30.0) {
                    category = '輕度肥胖';
                    badgeClass = 'bg-orange-100 text-orange-700';
                    adviceText = '您的 BMI 屬於輕度肥胖級別。建議規劃積極的飲食控制與一週至少 150 分鐘的中強度有氧運動。';
                    // Scale placement 59% - 71% (range 27 - 30)
                    pointerPercent = 59 + ((bmi - 27) / (30 - 27)) * 12;
                } else if (bmi >= 30.0 && bmi < 35.0) {
                    category = '中度肥胖';
                    badgeClass = 'bg-rose-100 text-rose-700';
                    adviceText = '您的 BMI 屬於中度肥胖級別。建議諮詢醫師或營養師，擬定個人化的減重計畫以降低慢性病風險。';
                    // Scale placement 71% - 85% (range 30 - 35)
                    pointerPercent = 71 + ((bmi - 30) / (35 - 30)) * 14;
                } else {
                    category = '重度肥胖';
                    badgeClass = 'bg-rose-200 text-rose-900';
                    adviceText = '您的 BMI 屬於重度肥胖級別。強烈建議至醫院心血管或減重門診進行專業評估與健康管理。';
                    // Scale placement 85% - 98% (range 35 - 45)
                    pointerPercent = Math.min(98, 85 + ((bmi - 35) / (45 - 35)) * 13);
                }

                // Update UI elements
                bmiValueEl.textContent = bmiFormatted;
                bmiBadgeEl.textContent = category;
                bmiBadgeEl.className = `inline-block px-3 py-1 mt-2 rounded-full text-xs font-bold transition-all duration-300 ${badgeClass}`;
                bmiAdviceEl.textContent = adviceText;
                bmiPointerEl.style.left = `${pointerPercent}%`;
            }

            // Sync Height
            heightInput.addEventListener('input', function() {
                heightRange.value = this.value;
                heightVal.textContent = `${this.value || 0} cm`;
                calculateBMI();
            });
            heightRange.addEventListener('input', function() {
                heightInput.value = this.value;
                heightVal.textContent = `${this.value} cm`;
                calculateBMI();
            });

            // Sync Weight
            weightInput.addEventListener('input', function() {
                weightRange.value = this.value;
                weightVal.textContent = `${this.value || 0} kg`;
                calculateBMI();
            });
            weightRange.addEventListener('input', function() {
                weightInput.value = this.value;
                weightVal.textContent = `${this.value} kg`;
                calculateBMI();
            });

            // Reset button
            resetBtn.addEventListener('click', function() {
                heightInput.value = 170;
                heightRange.value = 170;
                heightVal.textContent = '170 cm';

                weightInput.value = 65;
                weightRange.value = 65;
                weightVal.textContent = '65 kg';

                calculateBMI();
            });

            function renderHistory() {
                if (historyData.length === 0) {
                    emptyHistoryEl.classList.remove('hidden');
                    historyListEl.classList.add('hidden');
                    return;
                }

                emptyHistoryEl.classList.add('hidden');
                historyListEl.classList.remove('hidden');
                historyListEl.innerHTML = '';

                historyData.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 rounded-xl text-xs transition border border-slate-100';
                    row.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-slate-800 text-sm">${item.bmi}</span>
                            <span class="text-slate-500">${item.height} cm / ${item.weight} kg</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-slate-400 text-[11px]">${item.date}</span>
                            <button onclick="deleteHistoryItem(${index})" class="text-slate-300 hover:text-rose-500 transition p-1">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    `;
                    historyListEl.appendChild(row);
                });
            }

            saveBtn.addEventListener('click', function() {
                const heightCm = parseFloat(heightInput.value);
                const weightKg = parseFloat(weightInput.value);
                
                if (!heightCm || !weightKg) return;

                const heightM = heightCm / 100;
                const bmi = (weightKg / (heightM * heightM)).toFixed(1);
                const now = new Date();
                const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                historyData.unshift({
                    height: heightCm,
                    weight: weightKg,
                    bmi: bmi,
                    date: dateStr
                });

                // Keep last 15 items
                if (historyData.length > 15) {
                    historyData = historyData.slice(0, 15);
                }

                localStorage.setItem('bmi_history', JSON.stringify(historyData));
                renderHistory();

                // Button visual feedback
                const originalContent = saveBtn.innerHTML;
                saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> 已儲存！';
                saveBtn.classList.replace('bg-teal-500', 'bg-emerald-600');
                setTimeout(() => {
                    saveBtn.innerHTML = originalContent;
                    saveBtn.classList.replace('bg-emerald-600', 'bg-teal-500');
                }, 1200);
            });

            window.deleteHistoryItem = function(index) {
                historyData.splice(index, 1);
                localStorage.setItem('bmi_history', JSON.stringify(historyData));
                renderHistory();
            };

            clearHistoryBtn.addEventListener('click', function() {
                if (historyData.length === 0) return;
                historyData = [];
                localStorage.removeItem('bmi_history');
                renderHistory();
            });

            // Initial computation & rendering
            calculateBMI();
            renderHistory();
        });
    </script>
</body>
</html>
